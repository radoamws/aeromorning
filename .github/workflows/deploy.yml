name: Deploy to PlanetHoster

# Auto-deploy on every push to main, or trigger manually from the Actions tab.
# Single target: WordPress (repo root) -> /home/aeromorning/public_html
# (aeromorning.com). The former extract_news apps (api.aeromorning.com and
# news.aeromorning.com) were replaced by the aeromorning-news-pipeline plugin
# and removed from the repository.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   SSH_HOST, SSH_PORT, SSH_USER, SSH_PRIVATE_KEY
#
# Never touched by this workflow (already live on the server, not in git):
#   wp-config.php, .htaccess, wp-content/uploads/
# Cron jobs on the server are left untouched — they already exist and are
# out of scope for this pipeline.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy-wordpress:
    name: Deploy WordPress -> public_html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust host key
        run: ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync WordPress files
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/wp-config.php' \
            --exclude='/.htaccess' \
            --exclude='/.htaccess.bk' \
            --exclude='/.user.ini' \
            --exclude='/php.ini' \
            --exclude='/.ftpquota' \
            --exclude='/wp-content/uploads/' \
            --exclude='/wp-content/upgrade/' \
            --exclude='/wp-content/upgrade-temp-backup/' \
            --exclude='/wp-content/cache/' \
            --exclude='/wp-content/litespeed/' \
            --exclude='/wp-content/ewww/' \
            --exclude='/wp-content/gallery/*/cache/' \
            --exclude='/wp-content/mu-plugins/local-dev-overrides.php' \
            --exclude='/wp-content/debug.log' \
            --exclude='*.log' \
            --exclude='/prompt' \
            --exclude='/stat/' \
            --exclude='/*.md' \
            --exclude='/.gitignore' \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/aeromorning/public_html/"

      - name: Remove internal docs from the webroot
        # Repo-root notes (DEPLOYMENT-NOTES.md etc.) describe the security
        # setup and must never be web-readable. They're excluded above, but
        # rsync --delete leaves excluded files that are already on the
        # server, so remove those explicitly. Webroot top level only.
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "find /home/aeromorning/public_html -maxdepth 1 -type f \( -name '*.md' -o -name '.gitignore' \) -print -delete"
